name: Verify NEXUS v6.7.60 rollout

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-v6760.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify update endpoints
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            https://nexusbinary-production.up.railway.app/api/app-update \
            https://nexusbinary.up.railway.app/api/app-update
          do
            BODY=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "$URL")
            echo "$URL => $BODY"
            echo "$BODY" | grep -q '"versionCode":6760'
            echo "$BODY" | grep -q '"versionName":"6.7.60"'
            echo "$BODY" | grep -q 'NEXUS-Binary-v6.7.60.apk'
          done
