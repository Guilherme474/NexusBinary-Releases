name: Publish NEXUS Binary v6.7.59

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.59.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8ad0-820e-b5b7-12b1e64c041b/raw?se=2026-09-18T04%3A04%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=10edb717-7eed-57ee-81be-cdc8f3388244&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A16%3A48Z&ske=2026-09-18T18%3A16%3A48Z&sks=b&skv=2026-02-06&sig=g6sqzxclKsUnlKUJswnSmusbvEjHibGYNHnGIiA9cC4%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.59.apk
          test -s release-files/NEXUS-Binary-v6.7.59.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.59.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.59.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.59.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "987ca1ee68dff85cb001b67acd01612e534c86652dd1d81f2224ee8549e673d9"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.59

          Restauração administrativa:
          - restaura a seção “Acessos comerciais” para contas administradoras;
          - restaura “Contas cadastradas” e a listagem de testes/planos;
          - restaura a ponte segura getAdminAccounts/getAdminOverview no APK;
          - mantém a autorização ADMIN obrigatória no servidor;
          - os dados comerciais não foram perdidos, apenas a interface havia deixado de ser carregada.

          Mantém as correções e proteções da v6.7.58.
          VersionCode: 6759.
          O motor M1/M5, estratégias e polling do Cloud não foram alterados nesta versão.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.59 \
            release-files/NEXUS-Binary-v6.7.59.apk \
            release-files/NEXUS-Binary-v6.7.59.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.59.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.59" \
            --notes-file RELEASE_NOTES.md \
            --latest
