name: Publish NEXUS Binary v6.7.61

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.61.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0bac-820e-90d1-73d394e94c85/raw?se=2026-09-18T10%3A43%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=2c024ca4-b102-5aad-ac3b-26f4f073ec33&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A14%3A25Z&ske=2026-09-18T18%3A14%3A25Z&sks=b&skv=2026-02-06&sig=V2adOHpcUgw11G026RNn68EiN2C8%2BGUh2JunVs0YDZM%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.61.apk
          test -s release-files/NEXUS-Binary-v6.7.61.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.61.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.61.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.61.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "5da75438ff2460507f3f5767725db1b6b832d7d48bcb28a68e32b0599bef0c2a"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.61

          Correção do lembrete de atualização:
          - “AGORA NÃO” fecha apenas o aviso atual;
          - enquanto a atualização continuar pendente, o aviso pode reaparecer ao abrir/voltar ao NEXUS;
          - removido o antigo bloqueio persistente de 12 horas;
          - mantida proteção contra diálogos duplicados no mesmo momento.

          Mantém o modal visual do NEXUS, assinatura oficial, validação SHA/certificado, Cloud, painel administrativo e motor M1/M5.
          VersionCode: 6761.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.61 \
            release-files/NEXUS-Binary-v6.7.61.apk \
            release-files/NEXUS-Binary-v6.7.61.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.61.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.61" \
            --notes-file RELEASE_NOTES.md \
            --latest
