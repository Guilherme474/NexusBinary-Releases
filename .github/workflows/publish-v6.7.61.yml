name: Publish NEXUS Binary v6.7.61

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.61.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-355c-820e-8c6d-0f05c4b64622/raw?se=2026-09-18T10%3A13%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=6face950-2a69-50c4-bc68-8ac62e2c7b2d&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A02%3A10Z&ske=2026-09-18T18%3A02%3A10Z&sks=b&skv=2026-02-06&sig=LkOwFHPywk3ONBcGDiPLsfrbsesTeR9319gDTXdKVQc%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.61.apk
          test -s release-files/NEXUS-Binary-v6.7.61.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.61.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.61.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.61.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "42f5a46ab08ff15f6eb6ce3de2362b8b9a76634745de3b3eb9b4d5c47fe679ea"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.61

          Correção do lembrete de atualização:
          - remove o bloqueio de 12 horas após tocar em “AGORA NÃO”;
          - enquanto existir uma atualização pendente, o NEXUS verifica novamente sempre que o app volta para a frente;
          - evita abrir dois avisos de atualização ao mesmo tempo;
          - remove a checagem duplicada atrasada do onCreate.

          Mantém o novo modal nativo da v6.7.60, assinatura oficial, validação SHA/certificado, device proof, painel administrativo, Cloud e motor M1/M5.
          VersionCode: 6761.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.61 \
            release-files/NEXUS-Binary-v6.7.61.apk \
            release-files/NEXUS-Binary-v6.7.61.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.61.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.61" \
            --notes-file RELEASE_NOTES.md \
            --latest
