name: Verify NEXUS v6.7.59 rollout

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-v6759.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify update endpoints and web admin module
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            https://nexusbinary-production.up.railway.app/api/app-update \
            https://nexusbinary.up.railway.app/api/app-update
          do
            BODY=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "$URL")
            echo "$URL => $BODY"
            echo "$BODY" | grep -q '"versionCode":6759'
            echo "$BODY" | grep -q '"versionName":"6.7.59"'
            echo "$BODY" | grep -q 'NEXUS-Binary-v6.7.59.apk'
          done

          INDEX=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 https://nexusbinary.up.railway.app/)
          echo "$INDEX" | grep -q 'admin-accounts.js'
          ADMIN_JS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 https://nexusbinary.up.railway.app/admin-accounts.js)
          echo "$ADMIN_JS" | grep -q 'Acessos comerciais'
          echo "$ADMIN_JS" | grep -q '/web-api/admin/accounts'
