name: Publish NEXUS Binary v6.7.58

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.58.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f2ec-820e-8d8e-a4a4cb098f82/raw?se=2026-09-18T03%3A42%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=2705c0db-7be8-5d13-bce2-afc55a3fea37&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A04%3A39Z&ske=2026-09-18T18%3A04%3A39Z&sks=b&skv=2026-02-06&sig=rWeevfVE4icm61BEUj1yjdaLe18G20CtgfzYiHjWQlg%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.58.apk
          test -s release-files/NEXUS-Binary-v6.7.58.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.58.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.58.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.58.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "34947ba457b805abfddc77dd62936849ca4604bbf5750046001109e155a25496"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.58

          Correção do Cloud:
          - reinicia automaticamente o polling quando o token Firebase volta após uma renovação;
          - reinicia o scheduler quando o acesso é autorizado novamente;
          - requestNow reativa o scheduler se ele estiver parado;
          - uma RuntimeException isolada não cancela mais todo o loop de polling;
          - corrige o estado permanente “Cloud desconectado / Aguardando conexão” observado na v6.7.57.

          Mantém o device proof, anti-replay, Android Keystore, assinatura oficial e demais proteções.
          VersionCode: 6758.
          O motor M1/M5 não foi alterado.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.58 \
            release-files/NEXUS-Binary-v6.7.58.apk \
            release-files/NEXUS-Binary-v6.7.58.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.58.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.58" \
            --notes-file RELEASE_NOTES.md \
            --latest
