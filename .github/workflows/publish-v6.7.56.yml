name: Publish NEXUS Binary v6.7.56

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.56.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated main artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-28c8-820e-962b-5277514ac94a/raw?se=2026-09-18T03%3A11%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=4ba529f6-f668-57a8-8084-7cf368af83d4&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A21%3A50Z&ske=2026-09-18T18%3A21%3A50Z&sks=b&skv=2026-02-06&sig=oN0vTPbFH80og%2BAi9VVmJDhT8cDkpHAtqcha4p9WNPQ%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.56.apk
          test -s release-files/NEXUS-Binary-v6.7.56.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.56.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.56.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.56.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "dfe154b4a97e780873230dc5d1d7705505bff1d63f6a78c0812693131f354917"

      - name: Prepare notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.56

          Correção de sincronização após a v6.7.55:
          - a preferência do usuário aguarda a conclusão do device proof antes de ser enviada;
          - se a prova do aparelho precisar ser renovada, o APK revalida e repete a preferência automaticamente;
          - elimina o estado "Cloud online • preferência recusada" causado pela corrida entre configuração e ativação criptográfica;
          - mantém versionCode crescente (6756), assinatura oficial, vínculo criptográfico, anti-replay e demais proteções.

          O motor M1/M5 não foi alterado por esta correção.
          EOF

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.56 \
            release-files/NEXUS-Binary-v6.7.56.apk \
            release-files/NEXUS-Binary-v6.7.56.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.56.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.56" \
            --notes-file RELEASE_NOTES.md \
            --latest
