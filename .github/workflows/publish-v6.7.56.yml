name: Publish NEXUS Binary v6.7.56

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.56.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-217c-820e-9800-5c0631a5a10d/raw?se=2026-09-18T03%3A21%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=2718c72c-0194-5718-9a13-0acf1eeaeccf&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A29%3A00Z&ske=2026-09-18T18%3A29%3A00Z&sks=b&skv=2026-02-06&sig=CzMfkb55xFK57n5uH0ZPC8Xfm9YtWQCvRED6j5kjdZM%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.56.apk
          test -s release-files/NEXUS-Binary-v6.7.56.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.56.apk.sha256.sig

      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.56.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.56.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "92af2d7f82cf3dfc427adb414189ce1a527c9060f4b5c5c78877780386f1e946"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          NEXUS Binary v6.7.56

          Correção:
          - corrige a condição de corrida entre ativação do device proof e envio das preferências do usuário;
          - a preferência fica pendente até a validação criptográfica do aparelho terminar;
          - após a ativação, o APK reenvia automaticamente a preferência;
          - em erro/expiração do device proof, o APK revalida e tenta novamente;
          - evita o estado travado “Cloud online • preferência recusada”.

          Mantém o hardening de segurança e o versionCode monotônico 6756.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v6.7.56 \
            release-files/NEXUS-Binary-v6.7.56.apk \
            release-files/NEXUS-Binary-v6.7.56.apk.sha256 \
            release-files/NEXUS-Binary-v6.7.56.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "NEXUS Binary v6.7.56" \
            --notes-file RELEASE_NOTES.md \
            --latest
