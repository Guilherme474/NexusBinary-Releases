name: Verify NEXUS v6.7.56 update endpoints

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-v6756.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            https://nexusbinary-production.up.railway.app/api/app-update \
            https://nexusbinary.up.railway.app/api/app-update
          do
            BODY=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "$URL")
            echo "$URL"
            echo "$BODY"
            echo "$BODY" | grep -q '"versionCode":6756'
            echo "$BODY" | grep -q '"versionName":"6.7.56"'
            echo "$BODY" | grep -q 'NEXUS-Binary-v6.7.56.apk'
          done
