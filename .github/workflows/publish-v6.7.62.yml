name: Publish NEXUS Binary v6.7.62

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v6.7.62.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8898-820e-9f86-8ac19537a8ed/raw?se=2026-09-18T17%3A22%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8c7f1db5-3d43-55c4-a82f-ce43c753b036&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T13%3A28%3A27Z&ske=2026-09-19T13%3A28%3A27Z&sks=b&skv=2026-02-06&sig=B1YFqlNWhsaOYFPn55qbTSzlgsqkcEGu4Ch/47aUUnY%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o nexus-artifact.zip
          unzip -q nexus-artifact.zip -d release-files
          test -s release-files/NEXUS-Binary-v6.7.62.apk
          test -s release-files/NEXUS-Binary-v6.7.62.apk.sha256
          test -s release-files/NEXUS-Binary-v6.7.62.apk.sha256.sig
      - name: Verify exact APK SHA-256
        shell: bash
        run: |
          cd release-files
          EXPECTED=$(tr -d '[:space:]' < NEXUS-Binary-v6.7.62.apk.sha256)
          ACTUAL=$(sha256sum NEXUS-Binary-v6.7.62.apk | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = "69bbd4e00e8dd4ec977881266e6823126340472969d6b2fc66fd5c1d2ac5d44e"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v6.7.62 --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create v6.7.62 release-files/NEXUS-Binary-v6.7.62.apk release-files/NEXUS-Binary-v6.7.62.apk.sha256 release-files/NEXUS-Binary-v6.7.62.apk.sha256.sig --repo "${{ github.repository }}" --title "NEXUS Binary v6.7.62" --notes "Mercado/OTC somente e sincronização imediata do Cloud ao retomar o APK." --latest

# trigger retry 2
