name: Probe NEXUS v6.7.55 update endpoints

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-v6755.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both update endpoints
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            https://nexusbinary-production.up.railway.app/api/app-update \
            https://nexusbinary.up.railway.app/api/app-update
          do
            BODY=$(curl -fsSL --max-time 20 "$URL")
            echo "$URL"
            echo "$BODY"
            echo "$BODY" | grep -q '"versionCode":6755'
            echo "$BODY" | grep -q '"versionName":"6.7.55"'
            echo "$BODY" | grep -q 'NEXUS-Binary-v6.7.55.apk'
          done
